<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>페이지를 찾을 수 없음 · Food Desk</title><meta name="description" content="원문·사실·해석·가정·계산을 구분해 읽는 개인 투자 리서치 데스크."><meta name="color-scheme" content="light"><!-- 밝은 화면이 기본. 어두운 화면을 고른 적이 있을 때만 그리기 전에 적용한다. --><script>try { if (localStorage.getItem('rd-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script><meta name="robots" content="noindex,nofollow"><link rel="canonical" href="https://thesis-desk.github.io/food-briefing/404.html"><link rel="icon" type="image/svg+xml" href="/food-briefing/favicon.svg"><link rel="stylesheet" href="/food-briefing/_astro/Layout.Ckjz0cHh.css"></head><body><a class="skip" href="#main">본문으로 건너뛰기</a><header class="site-header"><div class="wrap bar"><a class="brand" href="/food-briefing/"><svg class="brand-mark" viewBox="0 0 18 18" aria-hidden="true"><path d="M1 3h16M1 9h16M1 15h10" stroke="currentColor" stroke-width="2.4" fill="none"></path></svg>Food Desk</a><nav aria-label="주요 메뉴"><ul><li><a href="/food-briefing/">요약</a></li><li><a href="/food-briefing/market/">지표·동종업체</a></li><li><a href="/food-briefing/news/">업계 뉴스</a></li><li><a href="/food-briefing/broker/">증권 리포트</a></li><li><a href="/food-briefing/analysis/">심층 분석</a></li><li><a href="/food-briefing/own/">자체 분석</a></li><li><a href="/food-briefing/earnings/">실적 발표</a></li><li><a href="/food-briefing/events/">행사</a></li><li><a href="/food-briefing/notes/">메모</a></li><li class="nav-end"><a href="/food-briefing/about/">소개</a></li><li><button type="button" class="theme-toggle" id="theme-toggle" hidden></button></li></ul></nav></div></header><main id="main" class="wrap"><div class="page-head"><h1>페이지를 찾을 수 없습니다</h1><p class="lede">주소가 바뀌었거나 아직 없는 페이지입니다.</p><p><a class="more" href="/food-briefing/">처음으로</a> · <a class="more" href="/food-briefing/earnings/">실적 발표</a></p></div></main><footer class="site-footer"><div class="wrap"><p class="foot-name">Food Desk</p><p>원문은 규칙으로 고른 공개 채널 글이며, 규칙 일치는 사실 검증이나 매매 판단이 아닙니다. <a href="/food-briefing/about/">자세히</a> <span class="sep">·</span> <a href="/food-briefing/about/#sources">출처와 수집 방법</a></p></div></footer><script>
      (function () {
        var b = document.getElementById('theme-toggle');
        if (!b) return;
        var root = document.documentElement;
        var paint = function () {
          var dark = root.dataset.theme === 'dark';
          b.textContent = dark ? '밝은 화면' : '어두운 화면';
          b.setAttribute('aria-label', dark ? '밝은 화면으로 바꾸기' : '어두운 화면으로 바꾸기');
        };
        b.addEventListener('click', function () {
          var dark = root.dataset.theme !== 'dark';
          if (dark) root.dataset.theme = 'dark'; else delete root.dataset.theme;
          try { localStorage.setItem('rd-theme', dark ? 'dark' : 'light'); } catch (e) {}
          paint();
        });
        paint();
        b.hidden = false;
      })();
    </script></body></html>
